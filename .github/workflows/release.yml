name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: .\build.cmd
        shell: cmd
      - run: gh release create "$GITHUB_REF_NAME" dist/dinput8.dll --title "$GITHUB_REF_NAME" --notes ""
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
